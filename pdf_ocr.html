<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --card: #111; --primary: #ffffff; --accent: #222; --text: #eee; }
        body { font-family: 'Comfortaa', cursive; background: var(--bg); color: var(--card); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: var(--bg); border: 2px dashed var(--card); padding: 3rem; border-radius: 24px; text-align: center; width: 350px; }
        h1 { font-size: 1.1rem; font-weight: 500; margin: 0 0 2rem; letter-spacing: 0.05em; text-transform: uppercase; color: #1d1d1d; }
        .file-zone { border: 1px solid #333; padding: 3rem 1rem; border-radius: 16px; position: relative; transition: all 0.3s; cursor: pointer; }
        .file-zone:hover { border-color: #ffffff; background: #000000; color: var(--text) }
        input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        #status { margin-top: 2rem; font-size: 0.8rem; color: #666; font-family: monospace; }
        .bar { width: 100%; height: 2px; background: #222; margin-top: 10px; border-radius: 2px; display: none; overflow: hidden; }
        #fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.2s; }
        .btn { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; margin-top: 1.5rem; cursor: pointer; width: 100%; display: none; }
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
</head>
<body>

<div class="card">
    <h1>OCR Studio</h1>
    <div class="file-zone">
        <span id="label">Drop PDF</span>
        <input type="file" id="input" accept="application/pdf">
    </div>
    <div id="status">IDLE</div>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <button id="dl" class="btn">DOWNLOAD PDF</button>
</div>

<script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const fill = document.getElementById('fill');
    const bar = document.getElementById('bar');
    const dl = document.getElementById('dl');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.textContent = "BOOTING TESSERACT...";
        bar.style.display = "block";
        dl.style.display = "none";

        try {
            const pdfData = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
            const outDoc = await PDFLib.PDFDocument.create();
            const font = await outDoc.embedFont(PDFLib.StandardFonts.Helvetica);

            const worker = await Tesseract.createWorker('eng');

            for (let i = 1; i <= pdf.numPages; i++) {
                status.textContent = `SCANNING PAGE ${i}/${pdf.numPages}`;
                fill.style.width = `${(i / pdf.numPages) * 100}%`;

                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                // Perform OCR
                const { data } = await worker.recognize(canvas);
                
                const newPage = outDoc.addPage([viewport.width, viewport.height]);
                
                // Draw image FIRST (bottom layer)
                const jpgUrl = canvas.toDataURL('image/jpeg', 0.8);
                const jpg = await outDoc.embedJpg(jpgUrl);
                newPage.drawImage(jpg, { x: 0, y: 0, width: viewport.width, height: viewport.height });

                // Draw text SECOND (top layer - invisible)
                if (data.words) {
                    data.words.forEach(word => {
                        const { x0, y0, x1, y1 } = word.bbox;
                        const textHeight = y1 - y0;
                        
                        // We use a small opacity (0.001) instead of 0. 
                        // Some PDF viewers ignore text with 0 opacity for selection.
                        newPage.drawText(word.text, {
                            x: x0,
                            y: viewport.height - y1, // PDF coordinates are bottom-up
                            size: textHeight * 0.8,
                            font: font,
                            opacity: 0.001, 
                        });
                    });
                }
            }

            await worker.terminate();
            const bytes = await outDoc.save();
            const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
            
            status.textContent = "COMPLETE";
            dl.style.display = "block";
            dl.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `searchable_${file.name}`;
                a.click();
            };

        } catch (err) {
            console.error(err);
            status.textContent = "CRITICAL ERROR";
        }
    });
</script>
</body>
</html>
