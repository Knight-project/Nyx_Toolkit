<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to PNG Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #000000;
            --text: #000000;
            --text-light: #232525;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --border-dash: 2px dashed black;
            --radius: 12px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Comfortaa', cursive;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 2.2rem; font-weight: 700; }
        .subtitle { font-size: 1.1rem; color: var(--text-light); margin-top: 8px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            border: var(--border-dash);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .card-header i { margin-right: 10px; }

        textarea {
            width: 100%;
            min-height: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: var(--radius);
            resize: vertical;
            font-family: 'Comfortaa', cursive;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
            transition: var(--transition);
        }

        textarea:hover, textarea:focus {
            outline: none;
            border: 2px solid black;
        }

        #markdown-preview {
            flex-grow: 1;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: var(--radius);
            overflow-y: auto;
            background: #ffffff;
            min-height: 350px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-family: 'Comfortaa', cursive;
            background: white;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Comfortaa', cursive;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: black; border: 2px solid black; }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            opacity: 0.85;
        }

        .bg-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bg-color {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: var(--transition);
        }

        .bg-color.active {
            border-color: black;
            transform: scale(1.15);
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        #status-message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .hidden { display: none; }
        .processing { background: #e7f5ff; color: #1971c2; border: 1px solid #a5d8ff; }
        .success { background: #ebfbee; color: #2b8a3e; border: 1px solid #b2f2bb; }
        .error { background: #fff5f5; color: #e03131; border: 1px solid #ffa8a8; }

        footer { text-align: center; margin-top: 40px; padding: 20px; border-top: 1px solid #eee; opacity: 0.7; }
        
        #markdown-preview h1, #markdown-preview h2, #markdown-preview h3 { margin-bottom: 15px; }
        #markdown-preview p { margin-bottom: 10px; }
        #markdown-preview pre { margin: 15px 0; border-radius: 8px; }
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Markdown to PNG</h1>
            <p class="subtitle">Beautiful, high-resolution snapshots of your notes</p>
        </header>
        
        <main>
            <div class="grid">
                <div class="card">
                    <div class="card-header"><i class="fas fa-pencil-alt"></i><h2>Input</h2></div>
                    <textarea id="markdown-input" placeholder="Type your markdown here..."></textarea>
                </div>
                
                <div class="card">
                    <div class="card-header"><i class="fas fa-eye"></i><h2>Preview</h2></div>
                    <div id="markdown-preview"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header"><i class="fas fa-cog"></i><h2>Conversion Settings</h2></div>
                <div class="options-grid">
                    <div class="option-group">
                        <label>Width (px)</label>
                        <input type="number" id="image-width" value="800">
                    </div>
                    <div class="option-group">
                        <label>File Name</label>
                        <input type="text" id="filename" value="markdown-image">
                    </div>
                    <div class="option-group">
                        <label>Resolution (DPI)</label>
                        <select id="scale">
                            <option value="1">1x (Standard)</option>
                            <option value="2" selected>2x (High DPI)</option>
                            <option value="3">3x (Ultra HD)</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Background</label>
                        <div class="bg-colors">
                            <div class="bg-color active" style="background-color: #ffffff;" data-color="#ffffff"></div>
                            <div class="bg-color" style="background-color: #f8f9fa;" data-color="#f8f9fa"></div>
                            <div class="bg-color" style="background-color: #fff9db;" data-color="#fff9db"></div>
                            <div class="bg-color" style="background-color: #e7f5ff;" data-color="#e7f5ff"></div>
                            <div class="bg-color" style="background-color: #1a1a1a;" data-color="#1a1a1a"></div>
                        </div>
                    </div>
                </div>
                
                <div id="status-message" class="hidden"></div>
                
                <div class="button-group">
                    <button id="preview-btn" class="btn-primary">
                        <i class="fas fa-sync"></i> Update Preview
                    </button>
                    <button id="download-btn" class="btn-secondary">
                        <i class="fas fa-download"></i> Download PNG
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const markdownInput = document.getElementById('markdown-input');
            const markdownPreview = document.getElementById('markdown-preview');
            const previewBtn = document.getElementById('preview-btn');
            const downloadBtn = document.getElementById('download-btn');
            const imageWidthInput = document.getElementById('image-width');
            const filenameInput = document.getElementById('filename');
            const scaleSelect = document.getElementById('scale');
            const bgColors = document.querySelectorAll('.bg-color');
            const statusMessage = document.getElementById('status-message');
            
            let currentBgColor = '#ffffff';

            function updatePreview() {
                const content = markdownInput.value || "*Preview will appear here...*";
                const htmlContent = marked.parse(content);
                markdownPreview.innerHTML = htmlContent;
                markdownPreview.style.backgroundColor = currentBgColor;
                
                const isDark = (currentBgColor === '#1a1a1a');
                markdownPreview.style.color = isDark ? '#ffffff' : '#000000';

                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            bgColors.forEach(btn => {
                btn.addEventListener('click', () => {
                    bgColors.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentBgColor = btn.getAttribute('data-color');
                    updatePreview();
                });
            });

            async function convertToPNG() {
                statusMessage.textContent = "Processing high-res image...";
                statusMessage.className = "processing";
                statusMessage.classList.remove('hidden');

                const width = parseInt(imageWidthInput.value) || 800;
                const scaleVal = parseInt(scaleSelect.value) || 2;
                
                const originalWidth = markdownPreview.style.width;
                markdownPreview.style.width = width + 'px';

                try {
                    const canvas = await html2canvas(markdownPreview, {
                        backgroundColor: currentBgColor,
                        scale: scaleVal,
                        width: width,
                        logging: false,
                        useCORS: true,
                        onclone: (clonedDoc) => {
                            const clonedPreview = clonedDoc.getElementById('markdown-preview');
                            clonedPreview.style.border = 'none';
                            clonedPreview.style.borderRadius = '0';
                            clonedPreview.style.backgroundColor = currentBgColor;
                        }
                    });

                    const fileName = `${filenameInput.value || 'markdown-export'}.png`;
                    const dataUrl = canvas.toDataURL('image/png');

                    // Convert data URL to blob for wider compatibility
                    const blob = await (await fetch(dataUrl)).blob();
                    
                    // 1. Check for modern 'navigator.share' for mobile
                    if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: blob.type })] })) {
                        await navigator.share({
                            files: [new File([blob], fileName, { type: blob.type })],
                            title: 'Download',
                            text: fileName,
                        });
                        statusMessage.textContent = "Shared successfully!";
                    } else if (typeof AndroidFunction !== 'undefined' && AndroidFunction.saveBlob) {
                        // 2. App-specific logic
                        AndroidFunction.saveBlob(dataUrl, fileName);
                        statusMessage.textContent = "Saved to Android Downloads!";
                    } else {
                        // 3. Fallback for desktop and older browsers
                        const link = document.createElement('a');
                        link.download = fileName;
                        link.href = URL.createObjectURL(blob);
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(link.href);
                        statusMessage.textContent = "Successfully exported!";
                    }
                    
                    statusMessage.className = "success";

                } catch (err) {
                    console.error('Oops, something went wrong!', err);
                    statusMessage.textContent = 'Error: Could not generate image.';
                    statusMessage.className = "error";
                } finally {
                    markdownPreview.style.width = originalWidth;
                    setTimeout(() => statusMessage.classList.add('hidden'), 4000);
                }
            }

            previewBtn.addEventListener('click', updatePreview);
            downloadBtn.addEventListener('click', convertToPNG);
            markdownInput.addEventListener('input', updatePreview);

            updatePreview();
        });
    </script>
</body>
</html>
