<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Joiner</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --soft-gray: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--white);
            color: var(--black);
            font-family: 'Comfortaa', cursive;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 500px;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        h1 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-weight: 300;
            font-size: 0.9rem;
            margin-bottom: 40px;
            opacity: 0.6;
        }

        .upload-area {
            width: 100%;
            border: 2px dashed var(--black);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--white);
        }

        .upload-area:hover {
            background-color: var(--soft-gray);
            transform: scale(1.02);
        }

        #file-list {
            list-style: none;
            padding: 0;
            margin: 30px 0;
            width: 100%;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 1.5px solid var(--black);
            border-radius: 15px;
            margin-bottom: 12px;
            background: var(--white);
            cursor: grab;
            box-shadow: 0 4px 0px var(--black);
        }

        .file-item:active {
            cursor: grabbing;
        }

        .file-item .name {
            flex: 1;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-btn {
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-family: 'Comfortaa';
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            margin-left: 10px;
        }

        button#merge-btn {
            font: inherit;
            width: 100%;
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 50px;
            padding: 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            margin-top: 10px;
        }

        button#merge-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="file"] { display: none; }
        .sortable-ghost { opacity: 0.3; }
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
</head>
<body>

<main>
    <h1>PDF Merger</h1>
    <p class="subtitle">arrange your files, then merge.</p>

    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <span>+ add your pdfs</span>
    </div>
    <input type="file" id="file-input" multiple accept="application/pdf">

    <ul id="file-list"></ul>

    <button id="merge-btn">join files</button>
</main>

<script>
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    let filesArray = [];

    // Initialize Sortable
    new Sortable(fileList, {
        animation: 300,
        ghostClass: 'sortable-ghost',
        onEnd: () => {
            // Reorder filesArray based on the new DOM order
            const ids = Array.from(fileList.children).map(li => li.dataset.id);
            filesArray.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
        }
    });

    fileInput.addEventListener('change', (e) => {
        const selectedFiles = Array.from(e.target.files);
        selectedFiles.forEach(file => {
            const id = Math.random().toString(36).substr(2, 9);
            filesArray.push({ id, file });
        });
        render();
        fileInput.value = ''; 
    });

    function render() {
        fileList.innerHTML = '';
        filesArray.forEach((item) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.dataset.id = item.id;
            li.innerHTML = `
                <span class="name">${item.file.name}</span>
                <button class="remove-btn" onclick="removeFile('${item.id}')">x</button>
            `;
            fileList.appendChild(li);
        });
        mergeBtn.style.display = filesArray.length > 1 ? 'block' : 'none';
    }

    window.removeFile = (id) => {
        filesArray = filesArray.filter(i => i.id !== id);
        render();
    };

    mergeBtn.addEventListener('click', async () => {
        mergeBtn.textContent = 'processing...';
        mergeBtn.disabled = true;

        try {
            // Access PDFDocument from the global PDFLib object
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();

            for (const item of filesArray) {
                const arrayBuffer = await item.file.arrayBuffer();
                const doc = await PDFDocument.load(arrayBuffer);
                const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }

            const bytes = await mergedPdf.save();
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Merged_PDF.pdf';
            link.click();
        } catch (e) {
            console.error(e);
            alert('Something went wrong. Please check if your PDFs are password protected or corrupted.');
        } finally {
            mergeBtn.textContent = 'join files';
            mergeBtn.disabled = false;
        }
    });
</script>

</body>
</html>
