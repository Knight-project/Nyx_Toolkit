<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Splitter</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
        :root {
            --primary: #17171a;
            --primary-dark: #000000;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #4cc9f0;
            --error: #f94144;
            --text: #212121;
            --text-light: #6c757d;
            --bg: #ffffff;
            --card: #ffffff;
            --border: #e9ecef;
            --radius: 8px;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', cursive;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1rem;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--card);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background-color: rgba(67, 97, 238, 0.03);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .upload-text {
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .btn-secondary:hover {
            background: #5e0b9e;
        }

        .btn-accent {
            background: var(--accent);
        }

        .btn-accent:hover {
            background: #e61e70;
        }

        input[type="file"] {
            display: none;
        }

        /* Status */
        .status {
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-top: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .status.info {
            background-color: #e3f2fd;
            color: #1976d2;
            display: block;
        }

        .status.success {
            background-color: #e8f5e9;
            color: #388e3c;
            display: block;
        }

        .status.error {
            background-color: #ffebee;
            color: #d32f2f;
            display: block;
        }

        .progress {
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Selection Area */
        .selection-area {
            display: none;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        .quality-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quality-btn {
            flex: 1;
            min-width: 120px;
            background-color: var(--bg);
            color: var(--text-light);
            padding: 12px;
            font-size: 0.9rem;
        }

        .quality-btn.active {
            background: var(--primary);
            color: white;
        }

        .tip {
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .page-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .page-thumb {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            aspect-ratio: 1 / 1.414;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            position: relative;
        }

        .page-thumb:hover {
            border-color: var(--primary);
        }

        .page-thumb.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(247, 37, 133, 0.3);
        }

        .page-thumb.split-point::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--secondary);
            border-radius: 2px 2px 0 0;
        }

        .page-thumb canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .page-number {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--primary);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .page-number.split-point {
            background: var(--secondary);
            box-shadow: 0 0 0 2px white;
        }

        /* Floating Dock */
        .floating-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            z-index: 100;
            background: var(--card);
            border-radius: 50px;
            padding: 10px 15px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
            align-items: center;
        }

        .floating-dock.show {
            display: flex;
        }

        .floating-dock input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            min-width: 150px;
        }

        .floating-dock input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .floating-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: var(--transition);
            color: white;
            font-size: 1.2rem;
        }

        .floating-btn:hover {
            transform: scale(1.1);
        }

        .extract-btn {
            background: var(--accent);
        }

        .reset-btn {
            background: var(--text-light);
        }

        .select-btn {
            background: var(--primary);
        }

        .split-btn {
            background: var(--secondary);
        }

        .remove-split-btn {
            background: var(--error);
        }

        .range-btn {
            background: var(--primary);
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-btn:hover {
            background: var(--primary-dark);
        }

        footer {
            text-align: center;
            padding: 25px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-preview {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            
            .quality-options {
                flex-direction: column;
            }
            
            .floating-dock {
                width: calc(100% - 30px);
                flex-wrap: wrap;
                justify-content: center;
                border-radius: var(--radius);
            }
            
            .floating-dock input {
                min-width: 100%;
                margin-bottom: 10px;
            }
            
            .range-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cut"></i> PDF Splitter</h1>
            <p class="subtitle">Split PDF files into smaller documents</p>
        </header>

        <main>
            <!-- Upload Area -->
            <section class="card">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <p class="upload-text">Drag & drop your PDF file here</p>
                    <button class="btn" id="chooseFileBtn">
                        <i class="fas fa-folder-open"></i> Choose PDF File
                    </button>
                    <input type="file" id="fileInput" accept=".pdf">
                </div>
                <div class="status" id="status"></div>
                <div class="progress" id="progress">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </section>

            <!-- Selection Area -->
            <section class="card selection-area" id="selectionArea">
                <h2 class="section-title">Split Options</h2>

                <!-- Quality Controls -->
                <div class="quality-options">
                    <button class="btn quality-btn active" data-quality="original">
                        <i class="fas fa-vector-square"></i> Original
                    </button>
                    <button class="btn quality-btn" data-quality="high">
                        <i class="fas fa-hd"></i> High (300 DPI)
                    </button>
                    <button class="btn quality-btn" data-quality="medium">
                        <i class="fas fa-tachometer-alt"></i> Medium (150 DPI)
                    </button>
                    <button class="btn quality-btn" data-quality="low">
                        <i class="fas fa-compress"></i> Small (72 DPI)
                    </button>
                </div>

                <!-- Tip -->
                <div class="tip">
                    <strong>Tip:</strong> For large PDFs, process in smaller chunks to avoid memory issues.
                </div>

                <!-- Page Preview -->
                <div class="page-preview" id="pagePreview"></div>
            </section>
        </main>

        <!-- Floating Dock -->
        <div class="floating-dock" id="floatingDock">
            <input type="text" id="pageRangeInput" placeholder="e.g., 1-3, 5, 7-9">
            <button class="range-btn" id="applyRangeBtn">
                <i class="fas fa-list-ol"></i> Apply
            </button>
            <div class="floating-btn select-btn" id="selectAllBtn" title="Select All">
                <i class="fas fa-check-double"></i>
            </div>
            <div class="floating-btn select-btn" id="clearAllBtn" title="Clear All">
                <i class="fas fa-times"></i>
            </div>
            <div class="floating-btn split-btn" id="setSplitPointBtn" title="Set Split Point">
                <i class="fas fa-scissors"></i>
            </div>
            <div class="floating-btn remove-split-btn" id="removeSplitPointBtn" title="Remove Split Point">
                <i class="fas fa-eraser"></i>
            </div>
            <div class="floating-btn extract-btn" id="floatingExtractBtn" title="Extract Selected Pages">
                <i class="fas fa-download"></i>
            </div>
            <div class="floating-btn reset-btn" id="floatingResetBtn" title="Reset">
                <i class="fas fa-redo"></i>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const CMAP_URL = "https://unpkg.com/pdfjs-dist@3.4.120/cmaps/";
        const CMAP_PACKED = true;
        const ENABLE_XFA = false;
        const SEARCH_FOR_UNSUPPORTED_ATTRS = false;
        
        // State
        let currentPdfDoc = null;
        let currentFileName = '';
        let selectedPages = new Set();
        let splitPoints = new Set();
        let currentQuality = 'original';

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const chooseFileBtn = document.getElementById('chooseFileBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const selectionArea = document.getElementById('selectionArea');
        const pagePreview = document.getElementById('pagePreview');
        const pageRangeInput = document.getElementById('pageRangeInput');
        const qualityButtons = document.querySelectorAll('.quality-btn');
        const floatingDock = document.getElementById('floatingDock');

        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        // Floating Action Buttons
        document.getElementById('applyRangeBtn').addEventListener('click', applyRange);
        document.getElementById('selectAllBtn').addEventListener('click', () => selectAll(true));
        document.getElementById('clearAllBtn').addEventListener('click', () => selectAll(false));
        document.getElementById('setSplitPointBtn').addEventListener('click', setSplitPoint);
        document.getElementById('removeSplitPointBtn').addEventListener('click', removeSplitPoint);
        document.getElementById('floatingExtractBtn').addEventListener('click', extractSelectedPages);
        document.getElementById('floatingResetBtn').addEventListener('click', resetForm);

        // Quality Buttons
        qualityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentQuality = btn.dataset.quality;
            });
        });

        // Helper Functions
        function showStatus(message, type = 'info') {
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function hideStatus() {
            status.className = 'status';
        }

        function updateProgress(percent) {
            progress.style.display = 'block';
            progressFill.style.width = `${percent}%`;
        }

        function hideProgress() {
            progress.style.display = 'none';
        }

        function selectAll(select) {
            if (select) {
                for (let i = 1; i <= currentPdfDoc.numPages; i++) {
                    selectedPages.add(i);
                }
            } else {
                selectedPages.clear();
            }
            updateThumbnailsUI();
        }

        function updateThumbnailsUI() {
            document.querySelectorAll('.page-thumb').forEach(thumb => {
                const pageNum = parseInt(thumb.dataset.page);
                if (selectedPages.has(pageNum)) {
                    thumb.classList.add('selected');
                } else {
                    thumb.classList.remove('selected');
                }
                
                // Update split point visualization
                if (splitPoints.has(pageNum)) {
                    thumb.classList.add('split-point');
                    const pageNumEl = thumb.querySelector('.page-number');
                    if (pageNumEl) pageNumEl.classList.add('split-point');
                } else {
                    thumb.classList.remove('split-point');
                    const pageNumEl = thumb.querySelector('.page-number');
                    if (pageNumEl) pageNumEl.classList.remove('split-point');
                }
            });
        }

        // Core Logic - FIXED FILE UPLOAD
        async function handleFileSelect() {
            if (typeof pdfjsLib === 'undefined') {
                showStatus('PDF library not loaded. Please check your internet connection and try again.', 'error');
                return;
            }

            const file = fileInput.files[0];
            if (!file || file.type !== 'application/pdf') {
                showStatus('Please select a valid PDF file.', 'error');
                return;
            }

            showStatus('Loading PDF...');
            updateProgress(20);

            try {
                const arrayBuffer = await file.arrayBuffer();
                
                // Properly configure PDF.js - CORRECT CONFIGURATION
                const loadingTask = pdfjsLib.getDocument({
                    data: new Uint8Array(arrayBuffer),
                    cMapUrl: CMAP_URL,
                    cMapPacked: CMAP_PACKED,
                    enableXfa: ENABLE_XFA,
                    stopAtErrors: false,
                });
                
                currentPdfDoc = await loadingTask.promise;
                currentFileName = file.name.replace('.pdf', '');

                showStatus(`PDF loaded (${currentPdfDoc.numPages} pages). Generating previews...`);
                updateProgress(50);

                await renderPageThumbnails();
                updateProgress(100);

                uploadArea.style.display = 'none';
                selectionArea.style.display = 'block';
                floatingDock.classList.add('show');
                showStatus('PDF loaded. Select pages to extract.', 'success');
                setTimeout(hideProgress, 1000);
            } catch (error) {
                console.error('Error loading PDF:', error);
                showStatus(`Failed to load PDF: ${error.message}`, 'error');
                hideProgress();
            }
        }

        async function renderPageThumbnails() {
            pagePreview.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= currentPdfDoc.numPages; i++) {
                const pageContainer = document.createElement('div');
                pageContainer.className = 'page-thumb';
                pageContainer.dataset.page = i;

                const pageNumSpan = document.createElement('span');
                pageNumSpan.className = 'page-number';
                pageNumSpan.textContent = i;
                pageContainer.appendChild(pageNumSpan);

                pageContainer.addEventListener('click', () => {
                    if (selectedPages.has(i)) {
                        selectedPages.delete(i);
                    } else {
                        selectedPages.add(i);
                    }
                    pageContainer.classList.toggle('selected');
                });

                fragment.appendChild(pageContainer);
            }

            pagePreview.appendChild(fragment);

            // Lazy loading with IntersectionObserver
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(async entry => {
                    if (entry.isIntersecting) {
                        const thumb = entry.target;
                        const pageNum = parseInt(thumb.dataset.page);
                        if (!thumb.querySelector('canvas')) {
                            try {
                                const page = await currentPdfDoc.getPage(pageNum);
                                const viewport = page.getViewport({ scale: 0.5 });

                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;

                                const renderContext = {
                                    canvasContext: context,
                                    viewport: viewport
                                };
                                
                                await page.render(renderContext).promise;
                                page.cleanup();

                                thumb.insertBefore(canvas, thumb.firstChild);
                                observer.unobserve(thumb);
                            } catch (e) {
                                console.error(`Error rendering thumbnail for page ${pageNum}:`, e);
                            }
                        }
                    }
                });
            }, {
                rootMargin: '0px 0px 100px 0px'
            });

            document.querySelectorAll('.page-thumb').forEach(thumb => {
                observer.observe(thumb);
            });
        }

        function applyRange() {
            const rangeStr = pageRangeInput.value.trim();
            if (!rangeStr) {
                showStatus('Please enter a page range.', 'info');
                return;
            }

            selectedPages.clear();
            const parts = rangeStr.split(',').map(p => p.trim());

            for (const part of parts) {
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    if (isNaN(start) || isNaN(end) || start < 1 || end > currentPdfDoc.numPages || start > end) {
                        showStatus(`Invalid range: ${part}`, 'error');
                        return;
                    }
                    for (let i = start; i <= end; i++) {
                        selectedPages.add(i);
                    }
                } else {
                    const pageNum = Number(part);
                    if (isNaN(pageNum) || pageNum < 1 || pageNum > currentPdfDoc.numPages) {
                        showStatus(`Invalid page number: ${part}`, 'error');
                        return;
                    }
                    selectedPages.add(pageNum);
                }
            }

            updateThumbnailsUI();
            showStatus(`Range applied. ${selectedPages.size} pages selected.`, 'success');
        }

        function setSplitPoint() {
            // Get the currently selected page (last clicked page)
            const selectedPageArray = Array.from(selectedPages);
            if (selectedPageArray.length === 0) {
                showStatus('Please select a page first to set as split point.', 'info');
                return;
            }
            
            // Use the last selected page as the split point
            const splitPointPage = Math.max(...selectedPageArray);
            
            // Add as split point
            splitPoints.add(splitPointPage);
            
            // Update UI to show split points
            updateThumbnailsUI();
            
            // Show confirmation
            const splitPointsArray = Array.from(splitPoints).sort((a, b) => a - b);
            showStatus(`Split point set at page ${splitPointPage}. Current split points: ${splitPointsArray.join(', ')}`, 'success');
        }

        function removeSplitPoint() {
            // Get the currently selected pages
            const selectedPageArray = Array.from(selectedPages);
            if (selectedPageArray.length === 0) {
                showStatus('Please select a page first to remove split point.', 'info');
                return;
            }
            
            // Check if any of the selected pages are split points
            let removedPoints = [];
            for (const page of selectedPageArray) {
                if (splitPoints.has(page)) {
                    splitPoints.delete(page);
                    removedPoints.push(page);
                }
            }
            
            if (removedPoints.length > 0) {
                // Update UI to show split points
                updateThumbnailsUI();
                
                // Show confirmation
                const splitPointsArray = Array.from(splitPoints).sort((a, b) => a - b);
                if (splitPointsArray.length > 0) {
                    showStatus(`Split points removed from pages: ${removedPoints.join(', ')}. Remaining split points: ${splitPointsArray.join(', ')}`, 'success');
                } else {
                    showStatus(`Split points removed from pages: ${removedPoints.join(', ')}. No split points remaining.`, 'success');
                }
            } else {
                showStatus(`None of the selected pages are split points.`, 'info');
            }
        }

        // Enhanced PDF creation with intelligent fallback
        async function createPdfWithQuality(pages, quality) {
            const { PDFDocument } = PDFLib;
            const newPdfDoc = await PDFDocument.create();
            let scaleFactor = 1;

            switch (quality) {
                case 'high': scaleFactor = 300 / 72; break;
                case 'medium': scaleFactor = 150 / 72; break;
                case 'low': scaleFactor = 72 / 72; break;
                default: scaleFactor = 1;
            }

            // Track pages that failed to copy
            const failedPages = [];
            let textPreservationWarning = false;
            
            for (const pageNum of pages) {
                if (quality === 'original') {
                    try {
                        // Try direct copying first to preserve text
                        const pageIndex = pageNum - 1;
                        const [copiedPage] = await newPdfDoc.copyPages(currentPdfDoc, [pageIndex]);
                        newPdfDoc.addPage(copiedPage);
                    } catch (copyError) {
                        console.warn(`Failed to copy page ${pageNum} directly:`, copyError);
                        failedPages.push(pageNum);
                        textPreservationWarning = true;
                        
                        // Fallback: render page as image (text will not be selectable)
                        try {
                            const page = await currentPdfDoc.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 2.0 }); // Higher quality for fallback
                            
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;

                            const renderContext = {
                                canvasContext: context,
                                viewport: viewport
                            };
                            
                            await new Promise((resolve, reject) => {
                                page.render(renderContext).promise.then(() => {
                                    page.cleanup();
                                    resolve();
                                }).catch(reject);
                            });

                            const imageData = canvas.toDataURL('image/jpeg', 0.95);
                            const imageBytes = await fetch(imageData).then(res => res.arrayBuffer());
                            const image = await newPdfDoc.embedJpg(imageBytes);

                            const newPage = newPdfDoc.addPage([viewport.width, viewport.height]);
                            newPage.drawImage(image, {
                                x: 0,
                                y: 0,
                                width: viewport.width,
                                height: viewport.height,
                            });
                        } catch (renderError) {
                            console.error(`Completely failed to process page ${pageNum}:`, renderError);
                            throw new Error(`Failed to process page ${pageNum} after all attempts`);
                        }
                    }
                } else {
                    // For non-original qualities, always render as image
                    try {
                        const page = await currentPdfDoc.getPage(pageNum);
                        const viewport = page.getViewport({ scale: scaleFactor });
                        
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        
                        await new Promise((resolve, reject) => {
                            page.render(renderContext).promise.then(() => {
                                page.cleanup();
                                resolve();
                            }).catch(reject);
                        });

                        const imageData = canvas.toDataURL('image/jpeg', 0.9);
                        const imageBytes = await fetch(imageData).then(res => res.arrayBuffer());
                        const image = await newPdfDoc.embedJpg(imageBytes);

                        const newPage = newPdfDoc.addPage([viewport.width, viewport.height]);
                        newPage.drawImage(image, {
                            x: 0,
                            y: 0,
                            width: viewport.width,
                            height: viewport.height,
                        });
                    } catch (e) {
                        console.error(`Error processing page ${pageNum}:`, e);
                        throw new Error(`Failed to process page ${pageNum}`);
                    }
                }
            }
            
            if (failedPages.length > 0) {
                console.warn(`Pages copied via fallback method (text not selectable):`, failedPages);
            }
            
            if (textPreservationWarning && quality === 'original') {
                showStatus(`Some pages were converted to images. Text selection may be limited.`, 'info');
            }

            return await newPdfDoc.save();
        }

        async function extractSelectedPages() {
            if (selectedPages.size === 0) {
                showStatus('No pages selected for extraction.', 'info');
                return;
            }

            showStatus('Creating PDF(s)...');
            updateProgress(0);
            hideStatus();

            try {
                const sortedSelectedPages = Array.from(selectedPages).sort((a, b) => a - b);
                const chunks = [];

                if (splitPoints.size > 0) {
                    // Create chunks based on split points
                    const sortedSplitPoints = Array.from(splitPoints).sort((a, b) => a - b);
                    let lastSplit = 0;
                    
                    for (const splitPoint of sortedSplitPoints) {
                        // Only include pages that are both selected and within this range
                        const chunk = sortedSelectedPages.filter(p => p > lastSplit && p <= splitPoint);
                        if (chunk.length > 0) {
                            chunks.push(chunk);
                        }
                        lastSplit = splitPoint;
                    }
                    
                    // Add final chunk with remaining selected pages
                    const finalChunk = sortedSelectedPages.filter(p => p > lastSplit);
                    if (finalChunk.length > 0) {
                        chunks.push(finalChunk);
                    }
                } else {
                    // No split points - extract all selected pages as one document
                    chunks.push(sortedSelectedPages);
                }

                if (chunks.length === 0) {
                    showStatus('No pages to extract.', 'info');
                    return;
                }

                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i];
                    updateProgress(((i + 1) / chunks.length) * 100);

                    const pdfBytes = await createPdfWithQuality(chunk, currentQuality);
                    const filename = chunks.length > 1 
                        ? `${currentFileName}_part${i + 1}.pdf` 
                        : `${currentFileName}_extracted.pdf`;
                    
                    // Use the download function properly
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }

                showStatus(`Created ${chunks.length} PDF file(s)!`, 'success');
                setTimeout(hideProgress, 1000);
            } catch (error) {
                console.error('Extraction error:', error);
                showStatus(`Error: ${error.message}`, 'error');
                hideProgress();
            }
        }

        function resetForm() {
            currentPdfDoc = null;
            currentFileName = '';
            selectedPages.clear();
            splitPoints.clear();
            currentQuality = 'original';
            
            qualityButtons.forEach((btn, i) => {
                if (i === 0) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            fileInput.value = '';
            pageRangeInput.value = '';
            pagePreview.innerHTML = '';
            uploadArea.style.display = 'block';
            selectionArea.style.display = 'none';
            floatingDock.classList.remove('show');
            hideStatus();
            hideProgress();
            showStatus('Form reset.', 'info');
        }
    </script>
